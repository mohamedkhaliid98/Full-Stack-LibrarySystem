<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Borrowed Books - Online Library</title>
    <link rel="stylesheet" href="css/dark-black.css" />
  </head>
  <body>
    <header>Online Library System</header>
    <nav id="navbar"></nav>
    <main>
      <h1>My Borrowed Books</h1>
      <p>List of books you currently have:</p>
      <table>
        <thead>
          <tr>
            <th>Book Title</th>
            <th>Author</th>
            <th>Borrow Date</th>
            <th>Return Deadline</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p>Note: Please return books before the deadline to avoid late fees.</p>
    </main>
    <script src="js/core.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/borrowed.js"></script>
  </body>
</html>
